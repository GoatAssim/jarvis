[project]
name = "jarvis-cli"
version = "1.4.0"
description = "A tuff, JSON-configurable command runner for your own shortcuts"
requires-python = ">=3.8"
dependencies = [
    "colorama; platform_system=='Windows'",
    "requests>=2.25",
    "psutil>=5.9",
    "ddgs>=9.0",
]

[project.optional-dependencies]
ytdl = ["yt-dlp>=2024.1"]
desktop = ["pyautogui>=0.9.54"]
ocr = ["pytesseract>=0.3.10", "Pillow>=9.0"]
# jarvis-enhancement-plan.md §3.5 — pluggable voice backends. All opt-in;
# none of these are in the base `dependencies` above. "voice-audio" is
# needed by every voice command (record/play); the tts-*/stt-* extras are
# per-provider so picking e.g. edge+faster_whisper doesn't pull in kokoro
# or vosk too.
voice-audio = ["sounddevice>=0.4.6", "soundfile>=0.12.1", "numpy>=1.22"]
voice-tts-kokoro = ["kokoro>=0.7.9", "soundfile>=0.12.1", "numpy>=1.22"]
voice-tts-edge = ["edge-tts>=6.1.0"]
# XTTS-v2 voice cloning (coqui-tts, the maintained idiap fork). Heaviest
# option by far: pulls in torch and downloads a ~2GB checkpoint on first
# use. Needs a reference clip you have the rights to (see
# tts.xtts.speaker_wav_path in voice_config.json) — not bundled in the
# default `voice` extra below since most people won't want the download.
voice-tts-xtts = ["coqui-tts>=0.24.1", "torch>=2.1", "soundfile>=0.12.1", "numpy>=1.22"]
voice-stt-whisper = ["faster-whisper>=1.0.0"]
voice-stt-vosk = ["vosk>=0.3.45"]
voice = [
    "jarvis-cli[voice-audio,voice-tts-edge,voice-stt-whisper]",
]

[project.scripts]
jarvis = "jarvis.cli:entry"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# AUTO-DISCOVERY, NOT A HAND-WRITTEN LIST — this was `packages = ["jarvis",
# "jarvis.voice", "jarvis.actions"]`, and jarvis.channels was missing from
# it. The symptom was vicious: running from a source checkout worked fine
# (the folder is right there on sys.path), and `pip install -e .` worked
# fine (editable installs point at the source tree), so the bug was
# invisible during development. Only a REAL install — what script.bat does
# — actually copies the declared packages into site-packages, and it
# silently copied everything except channels/:
#
#     ModuleNotFoundError: No module named 'jarvis.channels'
#       ... from .channels_cli import COMMANDS as _CHANNEL_COMMANDS
#
# which surfaced as "couldn't load logs" (cli.main() imports channels_cli
# before almost every command, so the failure had nothing to do with logs).
#
# A hand-maintained list means every future subpackage is one forgotten
# edit away from the same multi-hour debugging session. find: cannot forget.
include = ["jarvis*"]