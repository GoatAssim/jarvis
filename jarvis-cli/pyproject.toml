[project]
name = "jarvis-cli"
version = "1.4.0"
description = "A tuff, JSON-configurable command runner for your own shortcuts"
requires-python = ">=3.8"
dependencies = [
    "colorama; platform_system=='Windows'",
    "requests>=2.25",
    "psutil>=5.9",
    "ddgs>=9.0",
]

[project.optional-dependencies]
ytdl = ["yt-dlp>=2024.1"]
desktop = ["pyautogui>=0.9.54"]
ocr = ["pytesseract>=0.3.10", "Pillow>=9.0"]

[project.scripts]
jarvis = "jarvis.cli:entry"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["jarvis"]